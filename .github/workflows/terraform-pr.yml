name: Terraform PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:

  # --------------------------------------------------
  # 1. FORMAT
  # --------------------------------------------------

  fmt:
    name: OpenTofu Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OpenTofu Format Check
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            fmt -check -recursive


  # --------------------------------------------------
  # 2. VALIDATE COMPLETE PROJECT
  # --------------------------------------------------

  validate:
    name: OpenTofu Validate
    runs-on: ubuntu-latest
    needs: fmt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bootstrap does NOT use init/backend/plan/apply
      - name: Validate Bootstrap
        working-directory: bootstrap
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            validate

      # Core validation
      - name: Validate Core
        working-directory: src/core
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            validate

      # Service validation
      - name: Validate Service
        working-directory: src/service
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            validate


  # --------------------------------------------------
  # 3. CORE PLAN
  # --------------------------------------------------

  core-plan:
    name: Core Plan
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: OpenTofu Init
        working-directory: src/core
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -backend-config=backend/default.tfvars

      - name: OpenTofu Plan
        working-directory: src/core
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            plan \
            -out=core.tfplan

      - name: Upload Core Plan
        uses: actions/upload-artifact@v4
        with:
          name: core-plan-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: src/core/core.tfplan
          retention-days: 7


  # --------------------------------------------------
  # 4. SERVICE PLAN
  # --------------------------------------------------

  service-plan:
    name: Service Plan
    runs-on: ubuntu-latest
    needs: core-plan

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: OpenTofu Init
        working-directory: src/service
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -backend-config=backend/default.tfvars

      - name: OpenTofu Plan
        working-directory: src/service
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            plan \
            -out=service.tfplan

      - name: Upload Service Plan
        uses: actions/upload-artifact@v4
        with:
          name: service-plan-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: src/service/service.tfplan
          retention-days: 7


  # --------------------------------------------------
  # 5. OPTIONAL MANUAL APPLY
  #
  # This job is NOT a required PR check.
  # It waits for environment approval.
  # --------------------------------------------------

  apply:
    name: Manual Apply
    runs-on: ubuntu-latest

    needs:
      - core-plan
      - service-plan

    environment:
      name: terraform-apply

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Core Plan
        uses: actions/download-artifact@v4
        with:
          name: core-plan-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: src/core

      - name: Download Service Plan
        uses: actions/download-artifact@v4
        with:
          name: service-plan-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: src/service

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Core Init
        working-directory: src/core
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -backend-config=backend/default.tfvars

      - name: Apply Core
        working-directory: src/core
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            apply \
            -auto-approve \
            core.tfplan

      - name: Service Init
        working-directory: src/service
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -backend-config=backend/default.tfvars

      - name: Apply Service
        working-directory: src/service
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            apply \
            -auto-approve \
            service.tfplan