name: Terraform Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:

  # --------------------------------------------------
  # FORMAT
  # --------------------------------------------------

  fmt:
    name: OpenTofu Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OpenTofu Format Check
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            fmt -check -recursive


  # --------------------------------------------------
  # VALIDATE
  # --------------------------------------------------

  validate:
    name: OpenTofu Validate
    runs-on: ubuntu-latest
    needs: fmt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bootstrap
        working-directory: bootstrap
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            validate

      - name: Validate Core
        working-directory: src/core
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            validate

      - name: Validate Service
        working-directory: src/service
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            validate


  # --------------------------------------------------
  # CORE PLAN
  # --------------------------------------------------

  core-plan:
    name: Core Plan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Core Init
        working-directory: src/core
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -backend-config=backend/default.tfvars

      - name: Core Plan
        working-directory: src/core
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            plan \
            -out=core.tfplan

      - name: Upload Core Plan
        uses: actions/upload-artifact@v4
        with:
          name: deploy-core-plan-${{ github.sha }}
          path: src/core/core.tfplan


  # --------------------------------------------------
  # SERVICE PLAN
  # --------------------------------------------------

  service-plan:
    name: Service Plan
    runs-on: ubuntu-latest
    needs: core-plan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Service Init
        working-directory: src/service
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -backend-config=backend/default.tfvars

      - name: Service Plan
        working-directory: src/service
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            plan \
            -out=service.tfplan

      - name: Upload Service Plan
        uses: actions/upload-artifact@v4
        with:
          name: deploy-service-plan-${{ github.sha }}
          path: src/service/service.tfplan


  # --------------------------------------------------
  # CORE APPLY
  # --------------------------------------------------

  core-apply:
    name: Core Apply
    runs-on: ubuntu-latest

    needs:
      - core-plan
      - service-plan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Core Plan
        uses: actions/download-artifact@v4
        with:
          name: deploy-core-plan-${{ github.sha }}
          path: src/core

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Core Init
        working-directory: src/core
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -backend-config=backend/default.tfvars

      - name: Core Apply
        working-directory: src/core
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            apply \
            -auto-approve \
            core.tfplan


  # --------------------------------------------------
  # SERVICE APPLY
  # --------------------------------------------------

  service-apply:
    name: Service Apply
    runs-on: ubuntu-latest

    needs:
      - core-apply
      - service-plan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Service Plan
        uses: actions/download-artifact@v4
        with:
          name: deploy-service-plan-${{ github.sha }}
          path: src/service

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Service Init
        working-directory: src/service
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -backend-config=backend/default.tfvars

      - name: Service Apply
        working-directory: src/service
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            apply \
            -auto-approve \
            service.tfplan