name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'modules/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-main-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          

jobs:
  # ------------------------------------------------------------
  # CORE PLAN
  # ------------------------------------------------------------
  core-plan:
    name: Core Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-core-plan-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: OpenTofu Init
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/core \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -input=false \
            -reconfigure \
            -backend-config=backend/default.tfbackend

      - name: OpenTofu Plan
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/core \
            ghcr.io/opentofu/opentofu:1.12 \
            plan \
            -input=false \
            -var-file=vars/default.tfvars \
            -out=core.tfplan

      - name: Upload Core Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-main-core-plan-${{ github.run_id }}
          path: src/core/core.tfplan
          if-no-files-found: error
          retention-days: 2


  # ------------------------------------------------------------
  # CORE APPLY
  # ------------------------------------------------------------
  core-apply:
    name: Core Apply
    runs-on: ubuntu-latest
    needs: core-plan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Core Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-main-core-plan-${{ github.run_id }}
          path: src/core

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-core-apply-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: OpenTofu Init
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/core \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -input=false \
            -reconfigure \
            -backend-config=backend/default.tfbackend

      - name: OpenTofu Apply
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/core \
            ghcr.io/opentofu/opentofu:1.12 \
            apply \
            -input=false \
            -var-file=vars/default.tfvars \
            core.tfplan


  # ------------------------------------------------------------
  # SERVICE PLAN
  #
  # This intentionally runs AFTER Core Apply.
  # ------------------------------------------------------------
  service-plan:
    name: Service Plan
    runs-on: ubuntu-latest
    needs: core-apply

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-service-plan-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: OpenTofu Init
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/service \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -input=false \
            -reconfigure \
            -backend-config=backend/default.tfbackend

      - name: OpenTofu Plan
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/service \
            ghcr.io/opentofu/opentofu:1.12 \
            plan \
            -input=false \
            -var-file=vars/default.tfvars \
            -out=service.tfplan

      - name: Upload Service Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-main-service-plan-${{ github.run_id }}
          path: src/service/service.tfplan
          if-no-files-found: error
          retention-days: 2


  # ------------------------------------------------------------
  # SERVICE APPLY
  # ------------------------------------------------------------
  service-apply:
    name: Service Apply
    runs-on: ubuntu-latest
    needs: service-plan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Service Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-main-service-plan-${{ github.run_id }}
          path: src/service

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-service-apply-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: OpenTofu Init
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/service \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -input=false \
            -reconfigure \
            -backend-config=backend/default.tfbackend

      - name: OpenTofu Apply
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/service \
            ghcr.io/opentofu/opentofu:1.12 \
            apply \
            -input=false \
            -var-file=vars/default.tfvars \
            service.tfplan