name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:

  # --------------------------------------------------
  # CHECK BRANCH
  # --------------------------------------------------

  check-main:
    name: Verify Main Branch
    runs-on: ubuntu-latest

    steps:
      - name: Ensure workflow runs on main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Destroy can only run from main branch."
            exit 1
          fi

          echo "Destroy authorized for main branch."


  # --------------------------------------------------
  # SERVICE DESTROY
  # --------------------------------------------------

  service-destroy:
    name: Destroy Service
    runs-on: ubuntu-latest

    needs: check-main

    environment:
      name: terraform-destroy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Service Init
        working-directory: src/service
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -backend-config=backend/default.tfvars

      - name: Service Destroy
        working-directory: src/service
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            destroy \
            -auto-approve


  # --------------------------------------------------
  # CORE DESTROY
  # --------------------------------------------------

  core-destroy:
    name: Destroy Core
    runs-on: ubuntu-latest

    needs: service-destroy

    environment:
      name: terraform-destroy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Core Init
        working-directory: src/core
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            init \
            -backend-config=backend/default.tfvars

      - name: Core Destroy
        working-directory: src/core
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/opentofu/opentofu:1.12 \
            destroy \
            -auto-approve